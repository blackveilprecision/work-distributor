name: release
# scripts/release.sh (run on a Mac) publishes the release with the macOS binaries. This adds the Linux binaries and
# SHA256SUMS to it, then commits Formula/wd.rb for that version to main.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Tag matches package.json
        run: |
          v=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          [ "v$v" = "$TAG" ] || { echo "tag $TAG does not match package.json version $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Build the Linux binaries
        run: |
          mkdir -p dist/release
          for t in linux-x64 linux-arm64; do bun build --compile --target=bun-$t src/main.ts --outfile dist/release/wd-$t; done
          [ "$(dist/release/wd-linux-x64 --version)" = "$VERSION" ]
      - name: Add them and SHA256SUMS to the release
        run: |
          gh release download "$TAG" --pattern 'wd-darwin-*' --dir dist/release
          cd dist/release
          for f in wd-darwin-arm64 wd-darwin-x64 wd-linux-x64 wd-linux-arm64; do [ -s "$f" ] || { echo "missing $f"; exit 1; }; done
          sha256sum wd-darwin-arm64 wd-darwin-x64 wd-linux-x64 wd-linux-arm64 > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" wd-linux-x64 wd-linux-arm64 SHA256SUMS --clobber
      - name: Update Formula/wd.rb on main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p Formula
          bun scripts/formula.ts "$VERSION" dist/release/SHA256SUMS > Formula/wd.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/wd.rb
          git commit -m "Formula: wd $VERSION"
          git push origin main
