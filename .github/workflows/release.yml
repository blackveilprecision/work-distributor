name: release
# Push a tag v<version> (matching package.json) to publish binaries for macOS and Linux and update Formula/wd.rb on main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Tag matches package.json
        run: |
          v=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      - name: Build
        run: |
          mkdir -p dist/release
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun build --compile --target=bun-$t src/main.ts --outfile dist/release/wd-$t
          done
          # Apple silicon runs only signed binaries; an ad-hoc signature is enough for brew and curl downloads.
          codesign --force --sign - dist/release/wd-darwin-arm64 dist/release/wd-darwin-x64
          [ "$(dist/release/wd-darwin-arm64 --version)" = "$VERSION" ]
          (cd dist/release && shasum -a 256 wd-* > SHA256SUMS && cat SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --title "wd $VERSION" --generate-notes
      - name: Update Formula/wd.rb on main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p Formula
          bun scripts/formula.ts "$VERSION" dist/release/SHA256SUMS > Formula/wd.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/wd.rb
          git commit -m "Formula: wd $VERSION"
          git push origin main
