name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The tests run on macOS (the systemd path is covered by argument-building tests); see AGENTS.md.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun run build
